# /etc/nginx/snippets/jil-web-apps.conf
# The installed web versions of the apps (iPhone users add them to the home
# screen; web push needs HTTPS and a service worker), served from the API domain:
#   https://jilapi.ayhamashram.me/parents/  -> /var/www/jil/web/parents  (parents-app web export)
#   https://jilapi.ayhamashram.me/teacher/  -> /var/www/jil/web/teacher  (tech-app web export)
# Included inside the TLS server block of /etc/nginx/sites-available/jilapi:
#   include /etc/nginx/snippets/jil-web-apps.conf;

location = /parents { return 301 /parents/; }
location = /teacher { return 301 /teacher/; }

location /parents/ {
    alias /var/www/jil/web/parents/;
    # Static routes are exported as <route>.html; anything else is routed by the app
    try_files $uri $uri.html $uri/index.html /parents/index.html;
    add_header Cache-Control "no-cache";
}

location /teacher/ {
    alias /var/www/jil/web/teacher/;
    try_files $uri $uri.html $uri/index.html /teacher/index.html;
    add_header Cache-Control "no-cache";
}

# Hashed bundles never change: cache for a year
location ~ ^/(parents|teacher)/_expo/ {
    root /var/www/jil/web;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# The push service worker must always be fresh and may control its app folder
location ~ ^/(parents|teacher)/firebase-messaging-sw\.js$ {
    root /var/www/jil/web;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/$1/";
}
