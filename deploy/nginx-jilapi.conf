# /etc/nginx/sites-available/jilapi  (then: ln -s into sites-enabled)
# HTTP only: `certbot --nginx -d jilapi.ayhamashram.me` adds the TLS block and
# the redirect once the DNS A record points to this server.
server {
    listen 80;
    listen [::]:80;
    server_name jilapi.ayhamashram.me;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
