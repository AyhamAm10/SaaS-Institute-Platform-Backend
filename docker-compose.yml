# Local infrastructure for development.
# PostgreSQL is NOT managed here (the local instance keeps running as-is).
#   docker compose up -d      → start Redis
#   docker compose down       → stop it (data is kept in the redis-data volume)
services:
  redis:
    image: redis:7.4-alpine
    container_name: institute-platform-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
